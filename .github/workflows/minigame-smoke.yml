name: minigame-smoke
# 微信小游戏移植工程（仓库内 `minigame/`）—— 第 55 轮新增；第 56 轮加"安全区/出屏门禁"矩阵。
#
# 为什么要有它：移植工程此前在**仓库外**，云端 100+ 条门禁**一条也没覆盖它**。
#   现在源文件入库（产物 gitignore），云端跑：master → dist 重建 → 体积/分包闸门 → 真入口冒烟（4 分支）
#   → **4 个设备剖面的安全区/出屏门禁**（刘海有没有吃掉 HUD 文字，这条以前只能本机手动看数字）。
#
# ⚠ 失败诊断：全部走 `ci/run-gate.sh` 包装 —— 失败时把判据行打成 `::error::` annotation，
#   没有 admin 权限也能远程读到原因（与 verify-dist 同一套机制）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'ci/**'
      - 'minigame/**'
permissions:
  contents: read
jobs:
  minigame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 先从内联母版重建 dist（顺带验证 master→dist 那条链没断），移植工程的输入就是它
      - name: 重建 dist（内联母版 → 外链形态）
        run: node ci/build-dist.js

      - name: 体积/分包判据自测（6 例对照，必须全对）
        run: bash ci/run-gate.sh ci/out/minigame-build-selftest.log node minigame/build-minigame.mjs --selftest

      - name: 构建小游戏包（体积 + 分包声明）
        run: bash ci/run-gate.sh ci/out/minigame-build.log node minigame/build-minigame.mjs

      # 真入口冒烟：16 阶段（含 ⑯ 分包门控 4 分支）。默认场景 = 分包加载成功
      - name: 冒烟测试（16 阶段，默认场景 ok）
        run: bash ci/run-gate.sh ci/out/minigame-smoke.log node minigame/smoke.mjs

      # 三个分支各自是一次**期望行为**断言（跑通即 exit 0）—— 它们证明门控真的分得清四种情形
      - name: 分包分支：下载失败必须兜底启动
        run: bash ci/run-gate.sh ci/out/minigame-smoke-fail.log node minigame/smoke.mjs --no-play --subpackage-fail
      - name: 分包分支：老基础库无 API 直接启动
        run: bash ci/run-gate.sh ci/out/minigame-smoke-skip.log node minigame/smoke.mjs --no-play --no-loadsubpackage
      - name: 分包分支：永不回调必须**不**启动（阴性对照）
        run: bash ci/run-gate.sh ci/out/minigame-smoke-stall.log node minigame/smoke.mjs --no-play --subpackage-stall

      # 【第 56 轮】布局门禁的阴性对照：故意抽掉 safeArea 透传 ⇒ 必须 FAIL（证明它不是恒绿）
      - name: 布局门禁阴性对照（抽掉安全区透传必须报错）
        run: |
          set +e
          node minigame/smoke.mjs --no-play --layout --device 390x844 --safe 47 --no-safe-passthrough > /tmp/neg-safe.log 2>&1
          code=$?
          tail -n 5 /tmp/neg-safe.log
          if [ "$code" = "0" ]; then echo "::error::阴性对照失效 —— 抽掉安全区透传后布局门禁仍然绿（假保证）"; exit 1; fi
          echo "✅ 阴性对照有效（布局门禁确实拦下了没生效的剖面）"

      # 【第 57 轮】程序化音频体检的阴性对照：故意让音频桩写不进样本 ⇒ 必须 FAIL
      #   （小游戏形态不随包带 wav，玩家听到的 100% 是程序化合成 —— 这条是"听到的"那一路的波形级判据）
      - name: 程序化音频阴性对照（抽掉波形必须报错）
        run: |
          set +e
          node minigame/smoke.mjs --silent-synth > /tmp/neg-audio.log 2>&1
          code=$?
          tail -n 5 /tmp/neg-audio.log
          if [ "$code" = "0" ]; then echo "::error::阴性对照失效 —— 抽掉波形后程序化音频体检仍然绿（假保证）"; exit 1; fi
          echo "✅ 阴性对照有效（波形体检测的是样本，不是计数器）"

      # 【第 61 轮】画布预算的阴性对照：假装预渲染失控（多算 200 张 512²）⇒ 必须 FAIL
      #   这条守的是移植形态最大的真机风险：预渲染画布 ≈185 MB @RGBA（README §五 头号风险）。
      - name: 画布预算阴性对照（预渲染失控必须报错）
        run: |
          set +e
          CANVAS_HOG=200 node minigame/smoke.mjs > /tmp/neg-canvas.log 2>&1
          code=$?
          grep -E "画布预算|张数|体量" /tmp/neg-canvas.log | tail -n 4
          if [ "$code" = "0" ]; then echo "::error::阴性对照失效 —— 画布凭空翻倍后预算仍然绿（假保证）"; exit 1; fi
          echo "✅ 阴性对照有效（画布预算确实会拦人）"

      - name: 上传产物（日志 + 体积报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minigame-smoke
          path: ci/out/minigame-*.log
          retention-days: 14

  # 【第 56 轮】安全区/出屏门禁：4 个设备剖面各跑一次 `--no-play --layout`
  #   钉住的判据：A1 剖面真的生效（宿主 safeArea 传到母版）；A2 刘海带内文字元素 = 0。
  #   "越过画布边界 700~1196 个"与"带内 280 个 fill"**故意不判**（背景/世界元素铺满屏是设计内）。
  safe-area:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: '375x667', safe: 0,  label: '基准·无刘海' }
          - { device: '390x844', safe: 47, label: 'iPhone13类·刘海47' }
          - { device: '414x896', safe: 44, label: 'iPhone11类·刘海44' }
          - { device: '360x780', safe: 0,  label: '安卓窄屏·无刘海' }
    name: safe-area · ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 重建 dist + 小游戏包
        run: node ci/build-dist.js && node minigame/build-minigame.mjs
      - name: 出屏/安全区体检（${{ matrix.device }} +${{ matrix.safe }}）
        run: bash ci/run-gate.sh ci/out/minigame-safe-${{ matrix.safe }}.log node minigame/smoke.mjs --no-play --layout --device ${{ matrix.device }} --safe ${{ matrix.safe }}
