name: verify-dist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'ci/**'
permissions:
  contents: read
jobs:
  verify-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 从内联母版构建外链分发版（dist/）
        run: node ci/build-dist.js

      - name: 断言 dist 自包含（音频必须随包，不许静默降级到程序化）
        run: node ci/assert-dist-audio.mjs

      - name: 三形态内容级复核（音频哈希一致 + 贴图键一致 + 体积口径）
        run: node ci/final-audit.mjs

      - name: 跟宠贴图入库体检（接线级：7 只必须在 AI_ART_TABLE 里且值非空）
        run: TABLE_MODE=1 node ci/beast-art-audit.mjs

      - name: 内容缺口全维度扫描（12 维度，GATE=1 有缺口即失败）
        run: GATE=1 node ci/content-gap-scan.mjs

      - name: 安装 Playwright
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium

      - name: 验证外链分发版（线上发布的就是它）
        id: verify
        continue-on-error: true
        env:
          VERIFY_DIR: dist
        run: node ci/verify.mjs

      - name: 上传验证产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-dist-report
          path: ci/out/
          retention-days: 14
