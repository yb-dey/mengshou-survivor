name: verify-dist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'ci/**'
permissions:
  contents: read
jobs:
  verify-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 从内联母版构建外链分发版（dist/）
        run: node ci/build-dist.js

      # 【v1.172】门禁自审：扫描所有 workflow，断言"**声称是门禁的步骤必须真的会拦人**"。
      #   存在理由：本轮实测抓到 3 处「名字写着门禁/必须 PASS，却带 continue-on-error 且无收口」
      #   → 步骤永远绿，报告写 FAIL 也没人知道。**永远通过的守卫比没有守卫更危险。**
      #   ⚠ 本步骤本身**不得**带 continue-on-error（否则它就是在犯自己审查的错）。
      #   零依赖、秒级，故放在最前面 —— 连门禁本身都不可信时，后面跑再多也没意义。
      - name: 门禁自审（声称门禁的步骤必须真的会拦人）
        run: node ci/gate-audit.mjs

      - name: 断言 dist 自包含（音频必须随包，不许静默降级到程序化）
        run: node ci/assert-dist-audio.mjs

      # 【2026-09-21】音频映射一致性：CONFIG.audio.gains(会被渲染) vs AUDIO_ASSET.sfxFiles(会被加载)
      #   vs 磁盘文件，三者必须严格一致。实测抓到 4 个键（CARDSHOW/CHEST/EVENT/REVIVE）
      #   只有合成器、没有映射 → 永远拿不到外采文件，**覆盖 10 个埋点**且无任何报错。
      #   两张表各自自洽、只有交叉比才看得出来的缺口 = 静默降级的温床。
      - name: 音频映射断言自测（阴性对照：九种错法都要报）
        run: node ci/assert-audio-map.mjs --selftest
      - name: 音频映射一致性断言（GATE：不一致即失败）
        run: node ci/assert-audio-map.mjs

      - name: 三形态内容级复核（音频哈希一致 + 贴图键一致 + 体积口径）
        run: node ci/final-audit.mjs

      - name: 跟宠贴图入库体检（接线级：7 只必须在 AI_ART_TABLE 里且值非空）
        run: TABLE_MODE=1 node ci/beast-art-audit.mjs

      - name: 内容缺口全维度扫描（12 维度，GATE=1 有缺口即失败）
        run: GATE=1 node ci/content-gap-scan.mjs

      # 【2026-09-21】BGM 循环接缝：程序合成曲若首尾不接，循环处会"咔哒"爆音。
      #   判据先自测（阴性对照）再体检 —— 自测用的是「带包络的曲被截断」而非正弦
      #   （正弦天然无缝，拿它当阴性样本永远测不出问题，v1 就栽在这）。
      - name: BGM 循环接缝判据自测（阴性对照）
        run: python ci/loop-seam.py --selftest
      - name: BGM 循环接缝体检（GATE=1 有接缝超标即失败）
        run: mkdir -p ci/out && GATE=1 python ci/loop-seam.py game/audio ci/out/loop-seam.md

      # 【2026-09-21】BGM 频谱重心与编排平衡：只做跨曲横向比较（中位数+MAD 稳健离群），
      #   **不用绝对阈值** —— sine/triangle 高频物理为 0，任何"高频占比"类绝对阈值恒真。
      #   先自测（重心=基音 / 随音高单调 / 能分辨波形谐波 / 静音安全）再体检。
      - name: BGM 频谱判据自测（阴性对照）
        run: python ci/bgm-spectrum.py --selftest
      - name: BGM 频谱重心与编排平衡体检（仅提示，不作门禁）
        run: mkdir -p ci/out && python ci/bgm-spectrum.py game/audio ci/out/bgm-spectrum.md

      # 【2026-09-21】SFX 响度层级：量的是**能量加权响度**（简化 K 加权），不是峰值——
      #   峰值无法区分"尖脉冲"与"持续音"（自测 C 实测两者差 44.7dB 而峰值相同）。
      #   判据立场：高频事件必须低于低频事件，否则长局磨耳朵。
      - name: SFX 响度判据自测（阴性对照）
        run: python ci/sfx-loudness.py --selftest
      - name: SFX 响度层级体检（仅提示，不作门禁）
        run: mkdir -p ci/out && python ci/sfx-loudness.py game/audio ci/out/sfx-loudness.md

      # 【v1.170】SFX 意图-实响一致性：设计注释(1420 行)写的是**按事件频率分层**
      #   (受击/复活 > BOSS > 升级/选卡/结算 > 击杀/宝石 > 开火/命中)，
      #   所以判据必须比**档均值**，不能逐对比较 gain 与文件响度（二者不同尺度，
      #   第一版就栽在这：把合法的"短闷响 vs 长上扬"报成 21 组反向对）。
      #   先自测（层级正确必须 PASS / 层级塌陷必须 FAIL）再体检。
      - name: SFX 意图-实响判据自测（阴性对照）
        run: python ci/sfx-intent-vs-real.py --selftest
      - name: SFX 意图-实响一致性体检（GATE：档位层级塌陷即失败）
        run: mkdir -p ci/out && python ci/sfx-intent-vs-real.py . ci/out/sfx-intent-vs-real.md

      - name: 安装 Playwright
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium

      - name: 验证外链分发版（线上发布的就是它）
        id: verify
        continue-on-error: true
        env:
          VERIFY_DIR: dist
        run: node ci/verify.mjs

      # 【v1.171】重载帧时体检：verify.mjs 只量**开局轻载** fps；本作最重场景是**怪潮**
      #   (ch6 无尽可达 maxEnemy=200 同屏) —— 轻载 60fps 不能证明重载不卡。
      #   判据量**帧时间尾部**(p95) 而非 fps 均值，且**先断言"确实有怪"**再判帧率
      #   (否则"帧率好"可能只是"没怪" = 假阴性)；并内置阴性对照(注入阻塞必须报 FAIL)。
      - name: 重载帧时体检（怪潮：先证有怪，再判帧时间 p95）
        id: stress
        continue-on-error: true
        env:
          VERIFY_DIR: dist
        run: node ci/stress-perf.mjs

      # 【v1.172】存档完整性体检：SAVE_SCHEMA/迁移链/钳制是**唯一持久化通道**，
      #   而 Storage.load 的 catch **静默**落 defaultSave() —— 存档损坏时玩家只看到
      #   "进度没了"，没有报错/崩溃/日志。这类缺陷不被任何现有门禁发现。
      #   四组断言：结构完整 / chk 篡改拒绝(带正对照) / 六类脏值必须被钳制 / v1→v7 迁移不吞旧值。
      - name: 存档完整性体检（结构/篡改/钳制/迁移）
        id: save
        continue-on-error: true
        env:
          VERIFY_DIR: dist
        run: node ci/save-integrity.mjs

      # 【v1.172】⚠ 必须补齐的收口步骤 —— 否则上面三个体检**报了 FAIL 也显示 success**
      #   （本轮实测踩到：save-integrity 报告写着 FAIL，步骤却是绿勾）。
      #   原因：`continue-on-error: true` 让步骤失败**不**影响 job 结论。
      #   加它是为了"体检失败也要上传报告"，但代价是**门禁形同虚设**（永远是绿的）。
      #   → 标准解法：体检步骤只管产出报告(continue-on-error)，再单独用一步**读结论报错**。
      #   这是本仓库反复踩到的"守卫永远通过"反模式（永远绿的守卫比没有守卫更危险）。
      - name: 门禁收口（体检结论必须为 success，否则本步骤失败）
        if: always()
        run: |
          fail=0
          for pair in "verify:${{ steps.verify.outcome }}" "stress:${{ steps.stress.outcome }}" "save:${{ steps.save.outcome }}"; do
            name="${pair%%:*}"; out="${pair##*:}"
            if [ "$out" = "success" ]; then echo "✅ $name = success";
            else
              echo "❌ $name = $out"; fail=1;
              # ⚠ `skipped`/`cancelled` 几乎总是"上游步骤崩了"的连锁反应，而不是本步骤被判失败。
              #   （本轮实测：门禁自审因 ci/out 不存在而崩 → 后面三个体检全变 skipped。）
              #   直接报"门禁未通过"会把人引向错误的排查方向，故区分提示。
              case "$out" in
                skipped|cancelled) echo "   ⚠ 该步骤**没跑**（$out）——请优先检查**更早**的步骤是否崩溃/被跳过，而不是本步骤的判据。";;
              esac
            fi
          done
          if [ "$fail" = "1" ]; then echo "::error::门禁未通过 —— 见上方各体检报告（产物 verify-dist-report 里有 md）"; exit 1; fi

      - name: 上传验证产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-dist-report
          path: ci/out/
          retention-days: 14
