name: art-gen

# 自建"云端出图"能力：公开仓库的免费 Actions 分钟数 + hf-mirror 权重 + CPU 推理。
# 为什么这么建：本机 Gemini/OpenAI 两条 key 路已死（域不通 / 区域受限），匿名出图服务没有参考图能力
#   （实测同 prompt 换 model 返回字节完全相同 ⇒ image= 被忽略）。而**这个仓库本来就是公开的**，
#   分钟数免费、我又有推送权限 ⇒ 不需要任何新账号就能有一台云端出图机。
# 产物落回仓库 `_art/out/`（用内置 GITHUB_TOKEN 提交），这样取结果不需要 artifact 鉴权。
# 【第二次提交的修正】上一版在"参考图 img2img"步失败，而 Actions 的日志下载需要鉴权（本机无 token）
#   ⇒ 让工作流**自己把 stdout/stderr 写进 `_art/log/run.txt` 并无论成败都提交**，
#   这样失败原因会落进仓库，我用 raw/pull 就能读到 —— 自建能力必须连"自查"一起建。
on:
  push:
    paths:
      - '_art/**'
      - '.github/workflows/art-gen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONUNBUFFERED: '1'
      # 【第 101 轮】sd-turbo 4 步/512px 的结论：角色保住但**打不过现有手绘**（0.30 最像、0.50 已劣化）。
      # 换成 SDXL-turbo 再量一档：分辨率 768、1–2 步；跑不动（OOM/超时）就说明这台 runner 的天花板在这，
      # 失败原因会由工作流写进 _art/log/run.txt（回读通道）。
      ART_MODEL: stabilityai/sdxl-turbo
      ART_STEPS: '2'
      ART_SIZE: '768'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（CPU 轮子）
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir diffusers transformers accelerate safetensors pillow

      - name: 参考图 img2img（输出留档，失败也继续）
        continue-on-error: true
        run: |
          mkdir -p _art/log
          set +e
          python -u _art/gen.py > _art/log/run.txt 2>&1
          code=$?
          echo "" >> _art/log/run.txt
          echo "=== exit=$code ===" >> _art/log/run.txt
          echo "---- 环境自述 ----" >> _art/log/run.txt
          python -c "import torch,diffusers,sys;print('python',sys.version.split()[0]);print('torch',torch.__version__);print('diffusers',diffusers.__version__);print('hf_endpoint',__import__('os').environ.get('HF_ENDPOINT'))" >> _art/log/run.txt 2>&1
          tail -c 3000 _art/log/run.txt
          exit 0

      - name: 产物与日志提交回仓库（无论成败）
        if: always()
        run: |
          git config user.name  "art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          git add -A _art/out _art/log
          git diff --cached --quiet && echo "无产物变化" || git commit -m "art-gen: 产物/日志（$(date -u '+%Y-%m-%d %H:%M') UTC）"
          git push
