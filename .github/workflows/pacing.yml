name: pacing
# 微信小游戏《萌兽不好惹》**整局节奏实测**（`minigame/smoke.mjs --pacing`，第 62 轮新增）。
#
# 为什么要有它：⑱ 是仓库里第一条"整局级"判据（六章设计节拍 + 单章连续实战曲线），
#   但单章连续驱动就要上万到数万帧（ch6 实测 48431 帧）—— 本机跑六章会明显占 CPU，
#   而公开仓库的 Actions 分钟数免费不限 ⇒ 这件吃算力的活放云端（用户第 5 条）。
#
# 判据边界（重要）：本 job **只判"探针自身可信"**——采样点必须落在 runTime 目标 ±1s 内、
#   runTime 不回退、区间冻死必须报错、本局提前结束时豁免终局行。曲线数字（同屏怪峰值/等级/
#   阵亡时刻）是**数据不是阈值**：站桩 + 总选第一张卡 = **下界**口径，给它们设阈值只会制造假保证。
#
# ⚠ 通道限制（实测，改这个文件前先读）：
#   · GitHub 对**每一级注解只保留前 10 条**，且会去重/截断 ⇒ 必须**一章一行**：
#     第一版每章发 3–4 条 notice，ch2~ch6 的数据全被丢掉，只剩 ch1。
#   · 失败信息也要压成**一行**（原因区/派生/日志尾用 ~ 拼），多行 ::error:: 一条都拿不到。
#
# 读结果：`::notice::` 一行一章（含同屏怪/等级序列），表格线单独一行；完整采样表在
#   ci/out/pacing-ch*.log 产物里（下载需权限）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'minigame/**'
      - 'ci/**'
      - '.github/workflows/pacing.yml'
permissions:
  contents: read
jobs:
  pacing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⑱ 的输入 = 内联母版重建出的 dist + 小游戏包（与 minigame-smoke 同一条链）
      - name: 重建 dist + 小游戏包
        run: node ci/build-dist.js && node minigame/build-minigame.mjs

      - name: 六章节奏实测（一章一行 notice）
        run: |
          set -u
          # ⚠ GitHub 的 run 步骤是 bash -e：任何裸命令失败都会立刻退出脚本（后面那句 code=$? 根本不会执行）。
          #   这里用 trap 兜底，保证任何失败都至少留下一条可读注解。
          trap 'echo "::error::pacing 步骤异常退出（exit=$?，章 i=${i:-?}，log=${log:-?}）"' ERR
          # 通关线（秒）= 游戏 CONFIG 章节表的 winTime；只作 --tmax 驱动上限，权威源仍是 spine()
          mkdir -p ci/out   # 原先由 run-gate.sh 建目录，这里自己建
          LINES="240 300 360 480 600 600"
          # 采样表行（8 列：游戏t/runTime/墙钟/同屏怪/潮/等级/选卡/HP/state），用它抽序列
          ROW='^ +[0-9]+ +[0-9.]+ +[0-9.]+ +[0-9]+ +[01] +[0-9]+ +[0-9]+ +[0-9]+/[0-9]+ +[A-Z_]+$'
          i=0
          for line in $LINES; do
            i=$((i+1))
            log="ci/out/pacing-ch$i.log"
            # ⚠ 不用 run-gate.sh：它失败时会发 ~10 条 ::error::，把"每级只留前 10 条"的配额吃满，
            #   我自己那条带原因的单行注解就发不出来了（131827a 实测：只剩老三样，原因又丢了）。
            #   这里直接跑 node、自己收 exit code，只发**一条** ::error:: ⇒ 配额内必达。
            # ⚠ 必须放进 if 条件位：bash -e 下裸命令失败会直接退出，code=$? 永远执行不到（实测踩过）。
            if node minigame/smoke.mjs --pacing --ch $((i-1)) --tmax "$line" > "$log" 2>&1; then
              code=0
            else
              code=$?
            fi
            if [ "$code" = "0" ]; then
              if [ "$i" = "1" ]; then
                t=$(grep -E '^  (ch[0-9]|⇒ 六章)' "$log" | sed 's/^  */  /' | tr '\n' '~' | sed 's/%/%25/g')
                echo "::notice::六章节拍（时长/通关线/BOSS/潮窗）: $t"
              fi
              d=$(grep -E '派生：|首次升级|墙钟代价' "$log" | sed 's/^  */  /' | tr '\n' '~' | sed 's/%/%25/g')
              e=$(grep -E "$ROW" "$log" | awk '{printf "%s,", $4}' | sed 's/,$//')
              l=$(grep -E "$ROW" "$log" | awk '{printf "%s,", $6}' | sed 's/,$//')
              echo "::notice::第 $i 章（--tmax $line）: $d · 同屏怪序列: $e · 等级序列: $l"
            else
              # ⚠ 多行注解拿不到（去重/截断）⇒ 压成一行：原因区 + 派生 + 日志尾
              reason=$(grep -A 6 '❌' "$log" | tr '\n' '~' | sed 's/%/%25/g')
              derived=$(grep -E '派生：|首次升级|墙钟代价|冻结归属' "$log" | tr '\n' '~' | sed 's/%/%25/g')
              tail3=$(tail -n 3 "$log" | tr '\n' '~' | sed 's/%/%25/g')
              echo "::error::第 $i 章节奏探针自证没过（--ch $((i-1)) --tmax $line exit=$code）｜原因区: ${reason}｜派生: ${derived}｜日志尾: ${tail3}"
              exit 1
            fi
          done
          echo "::notice::六章节奏实测完成（口径=站桩不躲+总选第一张卡，数字是下界）"

      - name: 上传采样日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacing
          path: ci/out/pacing-ch*.log
          retention-days: 14
