name: death-frames
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Pillow
        run: pip install --quiet pillow

      - name: ① 抠图 + 缩 96×96 + 注入 AI_ART_TABLE
        run: python ci/build-dead-frames.py

      - name: 用注入版替换原 HTML（保证目录里只有一个）
        run: |
          cd game
          for f in *.dead.html; do
            [ -e "$f" ] || continue
            mv -f "$f" "${f%.dead.html}.html"
          done
          ls -la

      - name: ③ 受击帧：抠图 + 缩 192×192 + 注入（补 6 个缺口）
        env:
          ART_SUFFIX: '_hit'
          ART_SIZE: '192'
          ART_IDS: 'bear,raven,orbitcrab,boomfruit,sporecap,burrowmole'
        run: python ci/build-dead-frames.py

      - name: 用注入版替换（受击帧）
        run: |
          cd game
          for f in *.dead.html; do
            [ -e "$f" ] || continue
            mv -f "$f" "${f%.dead.html}.html"
          done

      - name: ④ 死亡帧接线（6 处纯增量插入）
        run: node ci/patch-death-wiring.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Playwright
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium

      - name: ③ 云端双通道验证（门禁）
        id: verify
        continue-on-error: true
        run: node ci/verify.mjs

      # 【v1.172】⚠ 收口步骤 —— 否则上面那句「（门禁）」是**空话**：
      #   `continue-on-error: true` 让验证失败**不影响 job 结论**，job 照样打绿勾。
      #   （与 verify-dist.yml / optimize-art.yml 同型的"守卫永远通过"反模式。）
      - name: 门禁收口（验证结论必须为 success，否则本步骤失败）
        if: always()
        run: |
          out="${{ steps.verify.outcome }}"
          if [ "$out" = "success" ]; then echo "✅ verify = success";
          else echo "::error::死亡帧/受击帧接入后验证未通过（verify=$out）—— 见产物 death-frames-result 里的 report.md"; exit 1; fi

      - name: 上传结果与验证产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: death-frames-result
          path: |
            ci/out/
            game/
          retention-days: 14
