name: art-audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: 导出美术联系表
        run: node ci/art-audit.mjs
      - name: 上传美术审计产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-audit
          path: ci/out/
          retention-days: 14
