name: verify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      # 中文字体：卡片宽度门禁要用真实字形度量中文；缺字体会静默退化成豆腐块/等宽，宽度不可信。
      - name: 安装中文字体（供字体度量门禁）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-microhei
          fc-list :lang=zh | head -5 || true
      # 零依赖静态门禁先跑（失败即快速反馈，不必等浏览器装完）
      # 文案卫生：作者标注（【假设】/【来源】）与占位符不得出现在玩家可见字符串里。
      - name: 文案卫生（作者标注 / 占位符）
        run: |
          node ci/text-hygiene.mjs --selftest
          node ci/text-hygiene.mjs
      # 术语一致性：同一玩家概念不得被两个词指代（**只报不拦**，先观察再收紧）。
      # 历史教训：站桩/站住 看似漂移，运行时实测为两个独立状态，误改即引入缺陷。
      - name: 术语一致性（只报不拦）
        run: |
          node ci/term-consistency.mjs --selftest
          node ci/term-consistency.mjs || true
      # 配方卡渲染宽度：卡宽压到装不下文案时，玩家读到的是带省略号的半句话。
      # 【v1.184】图鉴配方 tab 排 4+3 列 → 4 列卡宽仅 148px（可用 128px），曾实测 11/28 字段被
      #   hudFitText 截断。修法是「卡面文案按最窄卡定稿」+ tag 行紧凑拼接。此门禁防回归。
      # **只报不拦**（首次上线先观察，避免误伤历史布局）。
      - name: 配方卡渲染宽度（只报不拦）
        run: |
          node ci/card-fit.mjs . --selftest
          node ci/card-fit.mjs . || true
      # 大厅解锁条件文案 × 数据 交叉一致性：condText 是**玩家可见**的条件串，
      # 【v1.187】实测 `startmag`/`mapledart` 把 BOSS 时刻硬编码成 6:00/10:00，
      #   而 cond 只存 boss id、无章节限定 → 玩家**首次击杀**时才解锁：
      #   boss2 首次 = ch2 @5:00、boss3 首次 = ch4 @8:00 → 卡面时刻与实况不符（误导）。
      #   ⚠ 病根是"跨表抄了一份逐章变化的量"，**只有交叉比才看得见**（两边各自都合法）。
      #   **硬门禁**（不一致即失败）。
      - name: 解锁条件文案 × 数据 交叉核对（GATE）
        run: |
          node ci/unlock-text.mjs --selftest
          node ci/unlock-text.mjs
      # 表内文案数字 × 数值字段 交叉核对：desc/feel 里写死「+12/级」「100 只」
      # 【v1.188】同族病根第二处：文案与数值字段**同表并存**，改一边忘另一边就骗玩家。
      #   实测覆盖 DATA_HALL_TALENT(6) / DATA_ACHIEVE(13) / DATA_PASSIVE(14 条, 含
      #   per 对象型与 "N/s/级" 数值型两种形态) / DATA_COMBAT_EVO 兄弟名引用。
      #   ⚠ 三条"空跑陷阱"已封：① splitTopLevel 曾把整表当 1 条（只查首条）
      #   ② 判据 A 正则只认标量 per → 整张 DATA_PASSIVE 静默跳过
      #   ③ 阴性对照曾用 `|| mut===src` 把"变异没生效"当成"检出"（假绿）
      #   解析器对每张表断言条目数 == 实测值，退化即抛错。**硬门禁**。
      - name: 表内文案数字 × 数值字段 交叉核对（GATE）
        run: |
          node ci/desc-num-cross.mjs --selftest
          node ci/desc-num-cross.mjs
      # 成档（被动协同）文案一致性：一个成档的效果被写在 5 处（a 侧 desc / b 侧 desc /
      #   图鉴卡面 effect / 升级提示 complete / active），互相之间此前无任何门禁。
      # 【v1.189】实测抓出真缺陷：聚宝成档(hoard) 的 智慧果.desc 丢了 a 侧的
      #   "拾珠爆金环/珠越大环越狠"，读作"只有大珠才爆环"，与 v1.46 设计注释及
      #   tryHoardBurst(g) 拾取调用点不符；同句还被升级提示 complete 分支抄走。
      #   ⚠ B 判据必须**单向**（a ⊆ b）：设计上 b 侧 = a 侧 + 递进细节，要求双向相等
      #     会制造 6/7 假阳性。C/D 判据（effect/提示里的自铸短标签）**只报不拦** ——
      #     区分"压缩改写标签"与"凭空发明的机制"需语义判断，不可穷举，不配当门禁。
      #   解析器断言 DATA_PASSIVE=14 / DATA_CODEX_PAIR=7，退化即抛错。**硬门禁**。
      - name: 成档文案三侧一致性（GATE）
        run: |
          node ci/pair-text-cross.mjs --selftest
          node ci/pair-text-cross.mjs
      # 美术辨识度：敌人/子弹/图标之间"玩家分不分得开"从未被量过 —— 素材齐、亮度够时
      #   所有门禁全绿，但玩家第一眼可能分不清谁是谁。
      # 【v1.190】沿此维度量了整条链路，3 次接近误报**全部被前提验证拦住**：
      #   ① 剪影 IoU 最高 hedgehog~rollshell(0.872) → 看图：棕刺猬 vs 灰绿岩壳 → 假阳性
      #      （萌兽都是圆身坐姿 → 纯 alpha 掩膜天然趋同，指标无分辨力）
      #   ② 颜色最近 bear~boar(0.011)/orbitcrab~boomfruit(0.037) → 看图：獠牙鬃毛/蟹钳叶顶 → 非缺陷
      #   ③ 非敌人最近 maplecross~mapledart(0.029) → 查 branches：**同源二选一，永不同屏** → 设计
      #   ⇒ "像不像"不能靠单一指标判缺陷 → 本项**只报不拦**。
      #   判定必须三步：量数据(本脚本) → 读玩法路径(同屏/同源) → 看图。缺一不可。
      - name: 美术辨识度审计（只报不拦）
        run: |
          node ci/art-distinct-cross.mjs --selftest
          node ci/art-distinct-cross.mjs || true
      # 界面控件不得出屏：返回/关闭类控件是**唯一出口**，被裁即有真实可用性代价。
      # 【v1.185】图鉴配方 tab 的「返回」按钮实测底部出屏 32px（closeY 1248 + 64 = 1312 > 1280）。
      #   面板几何体检（screen-profile / card-band）测不到它 —— 那些量的是"面板内空带"，
      #   而出屏控件在视口之外。故独立设"越界"口径。**硬门禁**（有越界即失败）。
      - name: 界面控件出屏体检（GATE）
        run: |
          node ci/ui-fit.mjs --selftest
          node ci/ui-fit.mjs
      # 主题 HUD 字/底对比度：第 17 个"无人守"的维度。
      # 【v1.191】两套主题色板（DATA_CHAPTER 6 章 / DATA_WORLD_THEME 4 主题）各带
      #   hudFg(字) + hudWash(净底氛围条) + bgColor(底色)，渲染点 L25204 / L25195。
      #   实测 grep：**16 个既有门禁无一读这些字段**，text-legibility 又被证伪且只看渲染帧、
      #   无法定位到"哪张表哪一行"。⇒ 存在真实路径：改一个 hudFg 使字与底同色 →
      #   HUD 文字全消失而全部门禁绿灯。本脚本堵它。**硬门禁**。
      - name: 主题 HUD 对比度（GATE）
        run: |
          node ci/theme-contrast.mjs --selftest
          node ci/theme-contrast.mjs
      - name: 节点音 duck 覆盖可听段（GATE）
        run: |
          python3 ci/duck-cover.py --selftest
          python3 ci/duck-cover.py
      - name: 稀有度色·文字角色对比度（GATE）
        run: |
          python3 ci/rarity-contrast.py --selftest
          python3 ci/rarity-contrast.py
      - name: 存档字段·写入展示闭环（GATE）
        run: |
          python3 ci/save-field-loop.py --selftest
          python3 ci/save-field-loop.py
      - run: node ci/verify.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: ci/out/
          retention-days: 14
