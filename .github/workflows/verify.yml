name: verify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      # 中文字体：卡片宽度门禁要用真实字形度量中文；缺字体会静默退化成豆腐块/等宽，宽度不可信。
      - name: 安装中文字体（供字体度量门禁）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-microhei
          fc-list :lang=zh | head -5 || true
      # 零依赖静态门禁先跑（失败即快速反馈，不必等浏览器装完）
      # 文案卫生：作者标注（【假设】/【来源】）与占位符不得出现在玩家可见字符串里。
      - name: 文案卫生（作者标注 / 占位符）
        run: |
          node ci/text-hygiene.mjs --selftest
          node ci/text-hygiene.mjs
      # 术语一致性：同一玩家概念不得被两个词指代（**只报不拦**，先观察再收紧）。
      # 历史教训：站桩/站住 看似漂移，运行时实测为两个独立状态，误改即引入缺陷。
      - name: 术语一致性（只报不拦）
        run: |
          node ci/term-consistency.mjs --selftest
          node ci/term-consistency.mjs || true
      # 配方卡渲染宽度：卡宽压到装不下文案时，玩家读到的是带省略号的半句话。
      # 【v1.184】图鉴配方 tab 排 4+3 列 → 4 列卡宽仅 148px（可用 128px），曾实测 11/28 字段被
      #   hudFitText 截断。修法是「卡面文案按最窄卡定稿」+ tag 行紧凑拼接。此门禁防回归。
      # **只报不拦**（首次上线先观察，避免误伤历史布局）。
      - name: 配方卡渲染宽度（只报不拦）
        run: |
          node ci/card-fit.mjs . --selftest
          node ci/card-fit.mjs . || true
      # 大厅解锁条件文案 × 数据 交叉一致性：condText 是**玩家可见**的条件串，
      # 【v1.187】实测 `startmag`/`mapledart` 把 BOSS 时刻硬编码成 6:00/10:00，
      #   而 cond 只存 boss id、无章节限定 → 玩家**首次击杀**时才解锁：
      #   boss2 首次 = ch2 @5:00、boss3 首次 = ch4 @8:00 → 卡面时刻与实况不符（误导）。
      #   ⚠ 病根是"跨表抄了一份逐章变化的量"，**只有交叉比才看得见**（两边各自都合法）。
      #   **硬门禁**（不一致即失败）。
      - name: 解锁条件文案 × 数据 交叉核对（GATE）
        run: |
          node ci/unlock-text.mjs --selftest
          node ci/unlock-text.mjs
      # 表内文案数字 × 数值字段 交叉核对：desc/feel 里写死「+12/级」「100 只」
      # 【v1.188】同族病根第二处：文案与数值字段**同表并存**，改一边忘另一边就骗玩家。
      #   实测覆盖 DATA_HALL_TALENT(6) / DATA_ACHIEVE(13) / DATA_PASSIVE(14 条, 含
      #   per 对象型与 "N/s/级" 数值型两种形态) / DATA_COMBAT_EVO 兄弟名引用。
      #   ⚠ 三条"空跑陷阱"已封：① splitTopLevel 曾把整表当 1 条（只查首条）
      #   ② 判据 A 正则只认标量 per → 整张 DATA_PASSIVE 静默跳过
      #   ③ 阴性对照曾用 `|| mut===src` 把"变异没生效"当成"检出"（假绿）
      #   解析器对每张表断言条目数 == 实测值，退化即抛错。**硬门禁**。
      - name: 表内文案数字 × 数值字段 交叉核对（GATE）
        run: |
          node ci/desc-num-cross.mjs --selftest
          node ci/desc-num-cross.mjs
      # 成档（被动协同）文案一致性：一个成档的效果被写在 5 处（a 侧 desc / b 侧 desc /
      #   图鉴卡面 effect / 升级提示 complete / active），互相之间此前无任何门禁。
      # 【v1.189】实测抓出真缺陷：聚宝成档(hoard) 的 智慧果.desc 丢了 a 侧的
      #   "拾珠爆金环/珠越大环越狠"，读作"只有大珠才爆环"，与 v1.46 设计注释及
      #   tryHoardBurst(g) 拾取调用点不符；同句还被升级提示 complete 分支抄走。
      #   ⚠ B 判据必须**单向**（a ⊆ b）：设计上 b 侧 = a 侧 + 递进细节，要求双向相等
      #     会制造 6/7 假阳性。C/D 判据（effect/提示里的自铸短标签）**只报不拦** ——
      #     区分"压缩改写标签"与"凭空发明的机制"需语义判断，不可穷举，不配当门禁。
      #   解析器断言 DATA_PASSIVE=14 / DATA_CODEX_PAIR=7，退化即抛错。**硬门禁**。
      - name: 成档文案三侧一致性（GATE）
        run: |
          node ci/pair-text-cross.mjs --selftest
          node ci/pair-text-cross.mjs
      # 美术辨识度：敌人/子弹/图标之间"玩家分不分得开"从未被量过 —— 素材齐、亮度够时
      #   所有门禁全绿，但玩家第一眼可能分不清谁是谁。
      # 【v1.190】沿此维度量了整条链路，3 次接近误报**全部被前提验证拦住**：
      #   ① 剪影 IoU 最高 hedgehog~rollshell(0.872) → 看图：棕刺猬 vs 灰绿岩壳 → 假阳性
      #      （萌兽都是圆身坐姿 → 纯 alpha 掩膜天然趋同，指标无分辨力）
      #   ② 颜色最近 bear~boar(0.011)/orbitcrab~boomfruit(0.037) → 看图：獠牙鬃毛/蟹钳叶顶 → 非缺陷
      #   ③ 非敌人最近 maplecross~mapledart(0.029) → 查 branches：**同源二选一，永不同屏** → 设计
      #   ⇒ "像不像"不能靠单一指标判缺陷 → 本项**只报不拦**。
      #   判定必须三步：量数据(本脚本) → 读玩法路径(同屏/同源) → 看图。缺一不可。
      - name: 美术辨识度审计（只报不拦）
        run: |
          node ci/art-distinct-cross.mjs --selftest
          node ci/art-distinct-cross.mjs || true
      # 界面控件不得出屏：返回/关闭类控件是**唯一出口**，被裁即有真实可用性代价。
      # 【v1.185】图鉴配方 tab 的「返回」按钮实测底部出屏 32px（closeY 1248 + 64 = 1312 > 1280）。
      #   面板几何体检（screen-profile / card-band）测不到它 —— 那些量的是"面板内空带"，
      #   而出屏控件在视口之外。故独立设"越界"口径。**硬门禁**（有越界即失败）。
      - name: 界面控件出屏体检（GATE）
        run: |
          node ci/ui-fit.mjs --selftest
          node ci/ui-fit.mjs
      # 主题 HUD 字/底对比度：第 17 个"无人守"的维度。
      # 【v1.191】两套主题色板（DATA_CHAPTER 6 章 / DATA_WORLD_THEME 4 主题）各带
      #   hudFg(字) + hudWash(净底氛围条) + bgColor(底色)，渲染点 L25204 / L25195。
      #   实测 grep：**16 个既有门禁无一读这些字段**，text-legibility 又被证伪且只看渲染帧、
      #   无法定位到"哪张表哪一行"。⇒ 存在真实路径：改一个 hudFg 使字与底同色 →
      #   HUD 文字全消失而全部门禁绿灯。本脚本堵它。**硬门禁**。
      - name: 主题 HUD 对比度（GATE）
        run: |
          node ci/theme-contrast.mjs --selftest
          node ci/theme-contrast.mjs
      - name: 节点音 duck 覆盖可听段（GATE）
        run: |
          python3 ci/duck-cover.py --selftest
          python3 ci/duck-cover.py
      - name: 稀有度色·文字角色对比度（GATE）
        run: |
          python3 ci/rarity-contrast.py --selftest
          python3 ci/rarity-contrast.py
      - name: 存档字段·写入展示闭环（GATE）
        run: |
          python3 ci/save-field-loop.py --selftest
          python3 ci/save-field-loop.py
      # 加菜局过场「淡刀子」闭环：第 21 个"无人守"的维度。
      # 【v1.195】病根=**同一渲染位在两条分支上，一条填文案一条留空** ——
      #   普通章进局过场 cine.knife = chapterKnifeLine(ch)（有那句"淡刀子"），
      #   加菜局恒 ""（渲染块整段不执行）→ 玩家打加菜局只剩干巴巴的规则名。
      #   ⚠ 既有门禁全测不到：字段都有值、渲染点正常、布局也不越界 ——
      #     缺的是"某条分支上没人写这句文案"。修法是给 3 条规则各写一条 knife +
      #     接线改读 rule.knife（面板高度/平移由既有 knifeH/knifeShift 自动处理）。
      #   门禁含"作用域失控"防线：解析器曾把全项目 {id:...} 表都收进来（3 条误解成 37 条）。
      #   **硬门禁**。
      - name: 加菜局过场淡刀子闭环（GATE）
        run: |
          node ci/daily-knife.mjs --selftest
          node ci/daily-knife.mjs
      # 波次表「孤儿表」审计：第 22 个"无人守"的维度。
      # 【v1.197】病根=**同一份数据存在两套实现，其一手写却零读取** ——
      #   `DATA_WAVES_8`（14 行手写 8 分钟变体，逐行带 R2 调参注释）全项目零读取；
      #   真身是 v2.0 的 `buildWavesFor()`（以 DATA_WAVES_15 为唯一骨架按 winTime 压缩）。
      #   实测两者早已分叉：生成器对 ch4(480s) 产出 22 行/840 只，手表 14 行仅 1 行一致(7.1%)、
      #   总量 563 只（少 33%）⇒ 谁把它接回去 = **静默的行为回退**（开局少 1 兔波、P1 熊腰斩、缺喷嚏猬）。
      #   ⚠ 既有门禁全测不到：表非空、有注释、不参与布局 —— 问题是"被新实现取代却没删"。
      #   修法：显式标注「已废弃/预留」+ 说明为何不可接线；门禁守"零读取 + 有标记"这一状态。
      #   门禁含两条防线：注释窗口要够宽（曾用 400 字符窗口读不到上方标记）+ 解析退化不静默通过。
      #   **硬门禁**（发现未标记孤儿表即 exit 1）。
      - name: 波次孤儿表审计（GATE）
        run: |
          node ci/orphan-wave-table.mjs --selftest
          node ci/orphan-wave-table.mjs
      # BGM 规格自洽审计：第 23 个"无人守"的维度。
      # 【v1.198】病根=**规格声明与实现各写一份，且没有任何一处比它们** ——
      #   `DATA_BGM` 表头注释明写「44100Hz 参考采样数与 spec 给定值逐一吻合」，但 `refSmp`
      #   在 loop 曲上**全项目零读取**（消费点只有 jingle 分支 L12158 一处）⇒ 写错永不报错。
      #   实测连错三处：怪潮 288000 应为 576000（**恰好减半**）· 深渊 252000 应为 504000（**恰好减半**）
      #   · 启程 注释仍写 168000（v1.94 由 8 拍扩到 32 拍后未同步，表内 717560 才是对的）。
      #   ⚠ 既有门禁全测不到：值非空、有注释、参与渲染（只是那次渲染不读它）。
      #   判据 A 算术闭合(refSmp==beats*60/bpm*44100) · B 表头注释与表内值逐条相等 · C 全部曲被 BGM_TRACK_ORDER 收录。
      #   ⚠ 抽取必须**限定在声明段内**（曾因正则太宽，把解释性注释「应为 576000」当声明 → 6 处假红）。
      #   **硬门禁**（发现规格不自洽即 exit 1）。
      - name: BGM 规格自洽审计（GATE）
        run: |
          node ci/bgm-spec-coherence.mjs --selftest
          node ci/bgm-spec-coherence.mjs
      # 图鉴相对速度断言审计：第 24 个"无人守"的维度。
      # 【v1.199】病根=**同句式的相对断言，一条真一条假**（肉眼审读会"顺着读过去"）。
      #   fox   hint="剪影可分, 比兔更快"  spd 158 > rabbit 120  ✅ 真
      #   raven hint="剪影可分, 比鼠更快"  spd 148 < mouse  150  ❌ 假（鸦比鼠慢 2！）
      #   ⇒ 只有把断言**翻译成数据比较**才抓得住。这正是"文案是承诺、数据是事实"最阴的一类。
      #   判据 A 敌表/图鉴各 21 条且 id 集合相等 · B 「比X更快/更慢」必须与 spd 关系一致 · C 至少检出 1 条(防判据腐化)。
      #   ⚠ 三种失败模式都防：判据太窄→空跑假绿(用句式族) / 太宽→假红(先剥离注释) / 解析退化→假绿(全程下界断言)。
      #   **硬门禁**（发现断言与数据不符即 exit 1）。
      - name: 图鉴相对速度断言审计（GATE）
        run: |
          node ci/codex-speed-claim.mjs --selftest
          node ci/codex-speed-claim.mjs
      # 超武分叉 feel 文案审计：第 25 个"无人守"的维度。
      # 【v1.200】病根=与 v1.199 同族（文案是承诺、数据是事实），但**断言类型不同**：
      #   v1.199 守的是**相对断言**（"比鼠更快" → 两值比大小）
      #   本条守的是**绝对数量断言**（"八只近卫"/"四球远轨"/"六砾密环" → 必须等于 bulletCount）
      #   两类断言在代码里长得完全不像，同一次肉眼审读都会"顺着读过去"，所以必须分开守。
      #   判据 A DATA_SUPER 20 条 / FORK 10 组 20 分支且 id 集合相等
      #        B  数量断言：feel 里每个「数字+量词」必须 === 对应字段（量词族 只球砾向叶镖岩发枚道环）
      #        B2 定性方向词：**同族对照法** —— 同一条武器分叉的两个分支，方向词必须一正一反
      #           （"四岩**远**砸" orbitR 130 > "六砾**密**环" 62 / "**宽**束慢扫" laserW 40 > "**窄**束瞬斩" 14
      #            / "连锁雷云" chain 3 > "**短链**快劈" 1 …共 16 条规则；含"余燃"→burnDmg、"地雷"→dropPuddle）
      #        C  覆盖度下界（数量断言 ≥8、定性方向 ≥7），防判据腐化成恒绿。
      #   ⚠ 三种失败模式都防：太窄→空跑假绿(量词用族) / 太宽→假红(先 stripComments) / 解析退化→假绿(全程下界断言)。
      #   ⚠ 阴性对照已证伪 8 条：改数据 / 改文案 / 换单位 / 改方向字段 / 动别处不误报（`_qc/_neg-fork-feel.mjs` 6/6 + selftest 13/13）。
      #   **硬门禁**（发现断言与数据不符即 exit 1）。
      - name: 超武分叉 feel 文案审计（GATE）
        run: |
          node ci/fork-feel-count.mjs --selftest
          node ci/fork-feel-count.mjs
      # 装备跨表一致性审计：第 26 个"无人守"的维度。
      # 【v1.201】病根=**三张表各写一份事实，无一处比它们**（`DATA_GEAR` × `DATA_GEAR_SLOT` × `DATA_GEAR_RARITY`）。
      #   判据 A per 数组长度 === 稀有度档数（短了会 undefined）· B slot 必须存在于 SLOT 表
      #        C per 必须**单调递增**（"史诗 > 普通"是玩家直觉；回落 = 高稀有度反而更差 = 反直觉）
      #        D **同 slot+stat**（真正的替代关系）内 chMin 大的应更强 · E 同 slot+stat 不应 per 完全相同
      #   ⚠ 三个坑（本轮连踩）：
      #     第十六类 **前缀命名冲突** `indexOf('var DATA_GEAR')` 命中 `var DATA_GEAR_SLOT` ⇒ 解析 0 条却全绿
      #       ⇒ 修法 `var[ \t]+NAME[ \t]*=` 词边界锚点 + 解析条数下界断言。
      #     第十七类 **判据作用域失控** D 判据首版按 `stat` 单键分组，把**跨 slot 可同时装备**的
      #       `dewdrop(@necklace)` 与 `seedbelt(@belt)` 当替代品 ⇒ **假红 1 条** ⇒ 分组键改 `slot|stat`。
      #     第十三类变体 **变异没施加 ⇒ 假绿** selftest 的变异正则 ① 锚点用对象键（实为数组）② `[` `]` 未转义
      #       ③ **手抄常量对不上**（源码 `0.10` 抄成 `0.1`）⇒ 改为**从文件读真实值再变异** + `out !== base` 前置断言。
      #   **硬门禁**（发现跨表不一致即 exit 1）。
      - name: 装备跨表一致性审计（GATE）
        run: |
          node ci/gear-cross.mjs --selftest
          node ci/gear-cross.mjs
      # 第 27 维度（v1.202）：大厅解锁/成就文案 **不得硬编码"逐章变化量"**。
      #   病根：`DATA_HALL_UNLOCK.startbomb.condText` 写 "击破 3:00 锚点首领（巨盾龟）"，
      #     但 `boss1` 的出场时刻在 `DATA_CHAPTER[].bossTimes` **逐章不同**（180/150/180/160/180/180），
      #     而 `hallCondMet` 的 anchor 判定是 `saveData.hallAnchor["boss1"]` —— **任意章击破过即解锁，与章节无关**，
      #     ⇒ 任何单一时刻都无法对所有可达章节为真（ch2=2:30 / ch4=2:40 已失真）。
      #   **同族对照铁证**：v1.187 已把同组的 `startmag`/`mapledart` 改成章节无关表述，只有本条漏网
      #     ⇒ 按 v1.187 范式改为 "击破锚点首领（巨盾龟）"（**文案服从事实**）。
      #   判据：A 解析完整性（UNLOCK/ACHIEVE/TALENT 条数下界）· B `condText`/`desc` 无 `mm:ss`（**先剥注释**，
      #     否则会把我自己写的解释性注释判成违规）· C `（专名）` 必须在已知 boss/章节名表内
      #     · D 专名断言条数下界（**防判据被改空后恒绿**）。
      #   **硬门禁**（发现硬编码逐章变化量即 exit 1）。
      - name: 大厅解锁条件文案审计（GATE）
        run: |
          node ci/hall-cond-time.mjs --selftest
          node ci/hall-cond-time.mjs
      # 第 28 维度（v1.203）：赋值目标键名完整性 —— 防 sed 替换污染标识符。
      #   病根：早前 sed 替换把 `giftRarColorText: rarD.textDark` 误写成 `$1giftRarColorText: …`。
      #     `$1giftRarColorText` 是**合法标识符**（语法不报错），但生成的键名是字面的 `$1giftRarColorText`，
