name: verify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node ci/verify.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: ci/out/
          retention-days: 14
