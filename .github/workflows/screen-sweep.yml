name: screen-sweep
on:
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: 全界面巡检截图
        run: node ci/screen-sweep.mjs
      # 【2026-09-21】图像分析搬进 CI：用户硬规则是"吃算力的活（验证/构建/**分析**）全走云端，
      #   本机只做文本编辑"。此前逐像素统计（13 屏 × 72 万像素）都在本机跑 = 违规。
      - name: 安装分析依赖
        if: always()
        run: pip install pillow
      - name: 屏幕分析（CI 端产出文本报告）
        if: always()
        run: python ci/screen-analyze.py ci/out ci/out/analysis.md
      # 【v1.178】卡内死区双带扫描（范式 32）：同时扫 ①容器顶→首内容 ②末内容→容器底。
      #   只看一个会漏"底部大空档"——上一版分析器只有"面板内最长无内容带"这一个口径，
      #   面板级修完后同类缺陷下沉到**卡片内部**就再也测不出来（每日加菜卡 49px 死区即此漏网）。
      #   本步骤只出**候选清单**（文本），缺陷判定仍需同屏/同族对照。
      - name: 卡内死区双带扫描（候选清单）
        if: always()
        run: python ci/card-band.py ci/out ci/out/card-band.md
      # 【2026-09-21】判据自测先行：文字级可读性判据必须**先证明自己有效**（能区分深字/浅字、
      #   平坦图不误报），才允许用它的输出去下结论。曾因单位混用导致判据全灭 → 无自测就发现不了。
      #   ⚠ 但自测通过≠判据可用：该判据随后在**真实截图**上被证伪（合成自测有盲区，见文件头横幅）。
      - name: 文字可读性判据自测（阴性对照）
        if: always()
        run: python ci/text-legibility.py --selftest
      # ⚠【v1.172 复核】此处的 continue-on-error 是**有意保留、不要"修"**：
      #   该判据已在真实截图上被**证伪**（见文件名中的"已证伪"与 text-legibility.py 文件头横幅），
      #   步骤名也写明"仅留痕，不影响门禁"。它**不作为门禁**，所以**不应**加收口步骤。
      #   → 区分标准：`continue-on-error` 的步骤若**声称自己是门禁**（名字里有"门禁/必须 PASS"）
      #     就**必须**有收口步骤；若明确声明"仅提示/仅留痕"则**不应**加，否则会误伤正常构建。
      - name: 文字级可读性体检（⛔ 判据已证伪，仅留痕，不影响门禁）
        if: always()
        continue-on-error: true
        run: python ci/text-legibility.py ci/out ci/out/legibility-text.md
      - name: 上传巡检产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-sweep
          path: ci/out/
          retention-days: 14
      # 只含文本报告的**小产物**：本机只下载这一个（几 KB），不再下 40MB 的 PNG
      - name: 上传文本分析报告（本机只需下这个）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-analysis
          path: |
            ci/out/analysis.md
            ci/out/card-band.md
            ci/out/legibility-text.md
            ci/out/overview.png
          retention-days: 30
