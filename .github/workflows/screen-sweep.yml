name: screen-sweep
on:
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: 全界面巡检截图
        run: node ci/screen-sweep.mjs
      # 【2026-09-21】图像分析搬进 CI：用户硬规则是"吃算力的活（验证/构建/**分析**）全走云端，
      #   本机只做文本编辑"。此前逐像素统计（13 屏 × 72 万像素）都在本机跑 = 违规。
      - name: 安装分析依赖
        if: always()
        run: pip install pillow
      - name: 屏幕分析（CI 端产出文本报告）
        if: always()
        run: python ci/screen-analyze.py ci/out ci/out/analysis.md
      - name: 上传巡检产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-sweep
          path: ci/out/
          retention-days: 14
      # 只含文本报告的**小产物**：本机只下载这一个（几 KB），不再下 40MB 的 PNG
      - name: 上传文本分析报告（本机只需下这个）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-analysis
          path: |
            ci/out/analysis.md
            ci/out/overview.png
          retention-days: 30
