name: art-shots

# 18 屏巡检截图**自动落回仓库**（artifact 下载要鉴权，本机没有 token ⇒ 走 commit）。
# 【第二次提交的修正】第一版失败，而 **Actions 日志要鉴权**，我读不到原因 ——
#   这正是 P13「只建主路不建回读路」的复发：新建管道时必须同时建回读通道。
#   本版把 stdout/stderr 写进 `_shots/run.txt` 并**无论成败都 commit**，错因会落进仓库。
on:
  push:
    paths:
      - '_shots/**'
      - '.github/workflows/art-shots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备目录
        run: mkdir -p _shots ci/out

      - name: 安装 playwright（chromium）— 输出留档
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== node ==="; node -v
            echo "=== npm init ==="; npm init -y 2>&1 | tail -3
            echo "=== npm i playwright ==="; npm i --no-audit --no-fund playwright 2>&1 | tail -8
            echo "=== playwright install --with-deps chromium ==="; npx playwright install --with-deps chromium 2>&1 | tail -14
            echo "=== playwright version ==="; npx playwright --version 2>&1
          } > _shots/run.txt 2>&1
          tail -40 _shots/run.txt
          exit 0

      - name: 跑 18 屏巡检 — 输出追加同一日志
        continue-on-error: true
        run: |
          set +e
          {
            echo ""
            echo "=== node ci/screen-sweep.mjs ==="
            node ci/screen-sweep.mjs 2>&1
            echo "=== exit=$? ==="
            echo "=== ci/out ==="
            ls -la ci/out 2>&1 | head -30
          } >> _shots/run.txt 2>&1
          tail -60 _shots/run.txt
          exit 0

      - name: 7a 建目录
        if: always()
        continue-on-error: true
        run: mkdir -p _shots/v1210 && echo "7a ok"

      - name: 7b 拷截图 + 写 index.json
        if: always()
        continue-on-error: true
        run: |
          cp -f ci/out/*.png _shots/v1210/ 2>/dev/null || true
          node -e "const fs=require('fs');const f=fs.existsSync('ci/out')?fs.readdirSync('ci/out').filter(x=>x.endsWith('.png')):[];fs.writeFileSync('_shots/index.json',JSON.stringify({at:new Date().toISOString(),count:f.length,files:f},null,2));console.log('shots',f.length);"
          echo "7b ok"

      # ✅【第 137 轮补的**收口**】本 workflow 每一步都 `exit 0` / `|| true` **且**带 continue-on-error
      #   ⇒ **job 永远绿**：playwright 装不上、巡检产出 0 张图、脚本崩掉，看起来都和"无变化"一模一样。
      #   本项目对「名字像门禁却没有收口」的既定解法是**单独一步读结论报错**（见 verify-dist.yml L194-196），
      #   而本文件此前恰恰缺这一步 —— ①h 一直在提示「安全的前提是每个 continue-on-error 都有收口」。
      #   ⚠ 本步**不得**带 continue-on-error，否则它就是在犯自己审查的错。
      #   位置在 7b 之后：此时 index.json 已落盘；而 7c/7d 带 `if: always()` ⇒ 即便本步红了，
      #   截图与 run.txt 照样 commit 回仓库（回读通道不因变红而断）。
      - name: 7b′ 收口：读巡检自己的结论（本步不带 continue-on-error）
        if: always()
        run: |
          set +e
          n=$(node -e "try{console.log(require('./_shots/index.json').count)}catch(e){console.log(0)}")
          code=$(grep -oE '=== exit=[0-9]+ ===' _shots/run.txt 2>/dev/null | tail -1 | grep -oE '[0-9]+')
          errs=$(grep -c '::error::' _shots/run.txt 2>/dev/null || true)
          echo "截图数=$n · 巡检退出码=${code:-读不到} · run.txt 里 ::error:: = ${errs:-0}"
          bad=0
          if [ -z "$code" ]; then
            echo "::error::读不到巡检退出码 ⇒ 巡检根本没跑起来（装 playwright 失败或脚本崩）"; bad=1
          elif [ "$code" != "0" ]; then
            echo "::error::巡检自身退出码 $code（非 0）"; bad=1
          fi
          if [ "${errs:-0}" != "0" ]; then echo "::error::巡检输出里有 ${errs} 条 ::error::"; bad=1; fi
          # 21 = 2026-09-24 实测屏数（19 → 21：第 137 轮补了图鉴的 fork / item 两个页签，闭 O31）。
          # **增删屏时必须同步改这个数**：屏数变了就该有人确认一次，而不是静默地少几张。
          # （这条注释就是机制的一部分 —— 第 137 轮加屏时若不改，本步会红。）
          if [ "${n:-0}" -lt 21 ]; then echo "::error::只产出 $n 张截图（< 21）"; bad=1; fi
          exit $bad

      - name: 7c git add + commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "shots-bot"
          git config user.email "shots-bot@users.noreply.github.com"
          git add -f -A _shots ci/out
          git status --short | head -20
          git diff --cached --quiet && echo "7c 无变化" || git commit -m "art-shots: 截图 + 日志（$(date -u '+%Y-%m-%d %H:%M') UTC）"
          echo "7c ok"

      - name: 7d push（rebase + 重试）
        if: always()
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push origin HEAD:main && break || sleep 8
          done
          echo "7d ok"
