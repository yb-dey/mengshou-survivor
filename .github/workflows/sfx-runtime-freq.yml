name: sfx-runtime-freq
# 【新门禁】运行时 SFX 触发频次实测 + 「频率 × 响度」交叉判定
#
# 为什么需要它（第十四类病根）：
#   `CONFIG.audio.prios` 与 `sfx-loudness.py` 头注共同写明设计立场
#     "高频事件（每秒数次）必须显著低于低频事件（每局几次），否则长局被磨耳朵"。
#   而此前所有门禁（sfx-loudness / sfx-intent-vs-real / audio-audit）都只看**响度**，
#   从不看**次数** → "档位内混进高频事件"这种缺陷可以完全静默通过
#   （静态审计全绿时，某个音效仍可能"一局响十几次却比受击还响"）。
#
# 三步：
#   1) ci/sfx-runtime-freq.mjs        —— 真机跑整局，统计每个音效的**自发**触发次数
#   2) ci/sfx-freq-vs-loud.mjs        —— 次数 × 响度 交叉判定（档内 + 全局双判据）
#   3) ci/sfx-freq-vs-loud.selftest.mjs —— 阴性对照（证明门禁真的会报错）
on:
  workflow_dispatch:
  # 【第 49 轮】加 push 触发：这些只读审计此前只能手动跑，从没在代理提交上执行过
  push:
    branches: [main]
jobs:
  freq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: 1) 运行时 SFX 频次实测
        run: bash ci/run-gate.sh ci/out/sfx-runtime-freq.log node ci/sfx-runtime-freq.mjs
      - name: 2) 频率 × 响度交叉判定
        run: bash ci/run-gate.sh ci/out/sfx-freq-vs-loud.log node ci/sfx-freq-vs-loud.mjs
      - name: 3) 阴性对照（门禁必须会报错）
        run: node ci/sfx-freq-vs-loud.selftest.mjs
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfx-runtime-freq
          path: |
            ci/out/sfx-runtime-freq.*
            ci/out/sfx-freq-vs-loud.*
          retention-days: 14
